services:
  openmrs:
    image: openmrs/openmrs-core:2.7.7-amazoncorretto-17
    environment:
      ORTHANCTOKEN_KEYCLOAK_CLIENTSECRET: ${ORTHANC_CLIENT_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--connect-timeout",
          "5",
          "--max-time",
          "10",
          "http://localhost:8080/openmrs/health/started",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    platform: linux/arm64
    command: start-dev --import-realm
    networks:
      ozone:
      web:
    volumes:
      - ${KEYCLOAK_CONFIG_PATH}/realms:/opt/keycloak/data/import
      - ${KEYCLOAK_CONFIG_PATH}/themes/carbon:/opt/keycloak/themes/carbon
    environment:
      KC_HOSTNAME_ADMIN_URL: ${SERVER_SCHEME}://${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_URL: ${SERVER_SCHEME}://${KEYCLOAK_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: forwarded
      KC_DB: postgres
      KC_DB_URL_HOST: postgresql
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA}
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}

  orthanc-auth-service:
    image: orthancteam/orthanc-auth-service:latest
    platform: linux/amd64
    restart: unless-stopped
    networks:
      ozone:
        aliases:
          - orthanc-auth-service
    volumes:
      - ${ORTHANC_CONFIG_PATH}/../permissions.json:/orthanc-auth-service/permissions.json
    environment:
      ENABLE_KEYCLOAK: "true"
      PERMISSIONS_FILE_PATH: "/orthanc-auth-service/permissions.json"
      KEYCLOAK_URI: "http://keycloak:8080/realms/ozone/"
      KEYCLOAK_CLIENT_ID: "orthanc-service"
      KEYCLOAK_ADMIN_URI: "http://keycloak:8080/admin/realms/ozone/"
      # Browser-facing URLs, so they must be the public Orthanc host, not the
      # container name. Built from SERVER_SCHEME + ORTHANC_HOSTNAME the way the rest
      # of the stack does it — utils.sh sets ORTHANC_HOSTNAME per environment
      # (localhost:8889 locally, pacs-<ip>.traefik.me for a remote demo), so a
      # hardcoded localhost only ever worked on the developer's own machine.
      PUBLIC_ORTHANC_ROOT: "${SERVER_SCHEME}://${ORTHANC_HOSTNAME}/"
      PUBLIC_LANDING_ROOT: "${SERVER_SCHEME}://${ORTHANC_HOSTNAME}/ui/app/token-landing.html"
      PUBLIC_OHIF_ROOT: "${SERVER_SCHEME}://${ORTHANC_HOSTNAME}/ohif/"
      # Confidential client with serviceAccountsEnabled, since this service also
      # calls KEYCLOAK_ADMIN_URI. The previous value here matched no client in
      # ozone-realm.json at all, and was paired with clientId "orthanc" — a PUBLIC
      # client that by definition has no secret, so that pair could never
      # authenticate. The browser-facing "orthanc" public client stays in use by
      # OrthancExplorer2/OHIF via orthanc.json.
      KEYCLOAK_CLIENT_SECRET: "${ORTHANC_CLIENT_SECRET}"
      SECRET_KEY: "${ORTHANC_AUTH_SERVICE_SECRET_KEY}"
      USERS: '{"orthanc":"orthanc"}'

  orthanc:
    environment:
      - ORTHANC__AUTHENTICATION_ENABLED=false
    depends_on:
      postgres-orthanc:
        condition: service_healthy

  postgres-orthanc:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: orthanc
      POSTGRES_USER: orthanc
      POSTGRES_PASSWORD: ${ORTHANC_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthanc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orthanc-postgres-db:/var/lib/postgresql/data
    networks:
      ozone:
        aliases:
          - postgres-orthanc
    
  # Copies the routes jar from the distro tree into a shared volume. Version-agnostic:
  # this named eip-openmrs-orthanc-1.0.0-SNAPSHOT.jar while the Ozone artifact ships
  # 0.2.0, so the `cp` failed, this exited non-zero, and eip-openmrs-orthanc never
  # started because of its service_completed_successfully dependency below — silently
  # losing the whole OpenMRS<->Orthanc sync.
  #
  # Pull-only deployments use the %a-eip-openmrs-orthanc site image instead, which bakes
  # the jar in; EIP_OPENMRS_ORTHANC_ROUTES_PATH is a host path they cannot provide.
  eip-openmrs-orthanc-init:
      image: mekomsolutions/eip-client:2.2.0
      entrypoint: ["sh", "-c", "set -e; n=$$(ls /source/eip-openmrs-orthanc-*.jar 2>/dev/null | wc -l); if [ \"$$n\" -ne 1 ]; then echo \"expected exactly one routes jar in /source, found $$n\" >&2; ls -la /source >&2; exit 1; fi; cp /source/eip-openmrs-orthanc-*.jar /app/app.jar && echo \"routes jar copied\""]
      volumes:
        - "${EIP_OPENMRS_ORTHANC_ROUTES_PATH}:/source"
        - eip-openmrs-orthanc-app:/app
      networks:
        ozone:

  eip-openmrs-orthanc:
    image: mekomsolutions/eip-client:2.2.0
    # Fixed name written by the init container above, so this no longer has to track
    # the artifact's version.
    entrypoint: ["java", "-jar", "/app/app.jar"]
    command: []
    volumes:
      - eip-openmrs-orthanc-app:/app
      - eip-home-orthanc:/eip-home
    depends_on:
      eip-openmrs-orthanc-init:
        condition: service_completed_successfully
    environment:
      - ORTHANC_OAUTH_ENABLED=true
      - OAUTH_ACCESS_TOKEN_URL=http://keycloak:8080/realms/ozone/protocol/openid-connect/token
      - OAUTH_CLIENT_ID=orthanc-service
      - OAUTH_CLIENT_SECRET=${ORTHANC_CLIENT_SECRET}

  mysql:
    image: mariadb:10.11.13

  frontend:
    volumes:
      - "${OPENMRS_FRONTEND_BINARY_PATH}:/usr/share/nginx/html"
      - "${OPENMRS_FRONTEND_CONFIG_PATH}:/usr/share/nginx/html/configs"
      # The patched attachments ESM used to be bind-mounted here from
      # ${ORTHANC_ATTACHMENTS_PATCH_PATH}, which distro/pom.xml set to a sibling
      # checkout of openmrs-esm-patient-chart. That path exists on no other machine,
      # and since the mount target is a directory Docker silently creates an empty
      # one — serving an EMPTY attachments app instead of failing. To reinstate it,
      # publish the ESM and pin its version in spa-assemble-config.json.

  ohif:
    image: ohif/app:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      ozone:
        aliases:
          - ohif
    volumes:
      - "${ORTHANC_CONFIG_PATH}/../ohif-standalone-config.js:/usr/share/nginx/html/app-config.js"


volumes:
  orthanc-postgres-db:
  eip-openmrs-orthanc-app:

