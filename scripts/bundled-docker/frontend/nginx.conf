# UVL frontend nginx (UVL-EMR#806). Replaces /etc/nginx/nginx.conf of the upstream
# openmrs-reference-application-3-frontend image; see the "Serve the precompressed .br
# and .gz files" step in distro/pom.xml.
#
# What differs from upstream (worker, mime types, routes and the 404 fallback are the same):
#  - the precompressed .br and .gz files the assembly writes next to every chunk are
#    served. Upstream serves none of them, so Traefik compressed every response on the fly,
#    and it prefers gzip over brotli (a browser sending "gzip, deflate, br, zstd" got gzip,
#    about 20 % larger than the .br file). A response that already carries a
#    Content-Encoding is passed through by Traefik untouched.
#  - brotli is served without a brotli module (the image has none): when the browser
#    accepts br and a .br file exists, the request is rewritten to it and sent with
#    Content-Encoding: br. gzip_static covers the other browsers.
#  - fingerprinted files are "immutable", so a reload does not revalidate them.
#    importmap.json, routes.registry.json, index.html and service-worker.js stay revalidated.
#  - the access log carries the request duration.
#  - "/" redirects to home under the public prefix with a relative Location, instead of
#    "return 301 /home" (UVL-EMR#873): behind the proxy that strips /openmrs/spa the upstream
#    redirect lost the base path and the scheme.
worker_processes  1;
user              nobody;
events {
  worker_connections  1024;
  multi_accept        off;
}
http {
  include       mime.types;
  default_type  application/octet-stream;

  log_format  uvl_timed  '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
  access_log  /var/log/nginx/access.log  uvl_timed;

  tcp_nopush    on;
  tcp_nodelay   on;
  sendfile      on;
  keepalive_timeout  65;

  # Serve file.ext.gz instead of file.ext to browsers that accept gzip, when it exists.
  gzip_static   on;
  gzip_vary     on;

  # 1 when the browser accepts brotli (and has not excluded it with q=0).
  map $http_accept_encoding $uvl_br {
    default 0;
    "~*(^|[\s,])br\s*(,|$|;\s*q=(0\.[0-9]*[1-9]|[1-9]))" 1;
  }

  # The public path prefix the proxy stripped (Traefik sends X-Forwarded-Prefix).
  map $http_x_forwarded_prefix $uvl_prefix {
    default       /openmrs/spa;
    "~^(?<uvl_p>(/[A-Za-z0-9_-]+)+)/?$"  $uvl_p;
  }

  # Cache-Control by file. First match wins, so the service worker is listed first.
  # Everything not listed is revalidated on every load (importmap.json,
  # routes.registry.json, index.html, configs, source maps, hashed icons).
  map $uri $uvl_cache {
    default                                      "no-cache, must-revalidate";
    "~*service-worker\.js(\.br)?$"               "no-cache, must-revalidate";
    "~*\.js(\.br)?$"                             "public, max-age=31536000, immutable";
    "~*/openmrs\.(\w*\.)?css(\.br)?$"            "public, max-age=31536000, immutable";
    "~^(/_br)?/[0-9a-f]{16}\.(css|woff2)(\.br)?$"   "public, max-age=31536000, immutable";
  }

  server {
    listen  80;
    root    /usr/share/nginx/html;
    index   index.html;

    add_header Cache-Control $uvl_cache;

    # The bare address. Upstream answers "return 301 /home" here, but the container sits
    # behind a proxy that strips the /openmrs/spa prefix, so nginx built an absolute
    # http://<host>/home: no base path, no https, a 404 (#873). The proxy hands both
    # /openmrs/spa and /openmrs/spa/ to nginx as "/", and the application shows a blank page
    # at the address without the final slash, so the shell cannot simply be served here.
    # The answer is a relative redirect (absolute_redirect off) to home under the public
    # prefix: the prefix the proxy reports in X-Forwarded-Prefix, or /openmrs/spa without one.
    location = / {
      absolute_redirect off;
      return 302 $uvl_prefix/home;
    }

    # Site config files are rewritten by envsubst when the container starts; a
    # precompressed copy baked into the image would show the unsubstituted file.
    location ^~ /configs/ {
      gzip_static off;
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    # index.html and service-worker.js are rewritten in place by the container's startup.sh
    # (envsubst, sed), so a .gz or .br copy baked into the image is stale and would hand the
    # browser the unsubstituted file. They are never served precompressed.
    location ~* service-worker\.js$ {
      gzip_static off;
      try_files $uri =404;
    }
    location = /index.html {
      gzip_static off;
      try_files $uri =404;
    }

    # Brotli variants. These must come BEFORE the generic location below: regex locations
    # match in file order and /_br/x.js would otherwise match it again and loop.
    # A types block per type, because the .br extension carries no type.
    # A file without a .br copy (small files are not precompressed) falls back to the
    # plain location, which still serves a .gz copy to gzip browsers.
    location ~* ^/_br(?<uvl_orig>/.+\.js)$ {
      internal;
      types { application/javascript br; }
      add_header Cache-Control $uvl_cache;
      add_header Content-Encoding br;
      add_header Vary Accept-Encoding;
      try_files $uvl_orig.br @uvl_plain;
    }
    location ~* ^/_br(?<uvl_orig>/.+\.css)$ {
      internal;
      types { text/css br; }
      add_header Cache-Control $uvl_cache;
      add_header Content-Encoding br;
      add_header Vary Accept-Encoding;
      try_files $uvl_orig.br @uvl_plain;
    }
    location ~* ^/_br(?<uvl_orig>/.+\.json)$ {
      internal;
      types { application/json br; }
      add_header Cache-Control $uvl_cache;
      add_header Content-Encoding br;
      add_header Vary Accept-Encoding;
      try_files $uvl_orig.br @uvl_plain;
    }
    location @uvl_plain {
      add_header Cache-Control $uvl_cache;
      add_header Vary Accept-Encoding;
      try_files $uvl_orig =404;
    }

    location ~* \.(js|css|json)$ {
      if ($uvl_br) {
        rewrite ^(.+)$ /_br$1 last;
      }
      try_files $uri =404;
    }

    location ~* \.(?!html?)[^.]+$ {
      try_files $uri =404;
    }

    location / {
      gzip_static off;
      try_files /index.html =404;
    }
  }
}
