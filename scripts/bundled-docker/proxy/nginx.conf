# UVL copy of the Ozone bundled-docker proxy nginx.conf, with the request duration added to
# the log format (UVL-EMR#806): rt is the whole request, urt the time the upstream (OpenMRS,
# the frontend) took, "-" when there was none. Everything else is unchanged. Copied over the
# upstream file by the "Add UVL bundled docker files" step in distro/pom.xml.
user  nobody;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
  worker_connections  1024;
}


http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

  access_log  /var/log/nginx/access.log  main;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;

  keepalive_timeout  65;
  resolver 127.0.0.11;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;
  include /etc/nginx/conf.d/*.conf;
}