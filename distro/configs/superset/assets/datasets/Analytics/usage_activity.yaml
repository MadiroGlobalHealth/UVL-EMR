table_name: usage_activity
main_dttm_col: activity_datetime
description: 'Usage and adoption: one row per encounter, new order, visit and registration (UVL-EMR#285)'
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: |-
  -- Usage and adoption: one row per recorded activity (UVL-EMR#285).
  -- activity_kind is Encounter, Order, Visit or Registration; service is the
  -- encounter type, order type or visit type. Voided records are excluded, and
  -- only NEW orders count (a revision or discontinuation is not a new order).
  -- user_key identifies the OpenMRS user who saved the record. Registrations carry
  -- no user_key because the flattened patients table only has the numeric creator,
  -- so a user is active when they saved an encounter, an order or a visit.
  -- Times are as stored by OpenMRS (UTC).
  SELECT 'Encounter' AS activity_kind,
         e.encounter_datetime AS activity_datetime,
         COALESCE(e.encounter_type, '(unknown)') AS service,
         e.location AS location,
         e.creator_uuid AS user_key,
         e.patient_uuid AS patient_uuid,
         e.encounter_uuid AS record_uuid
  FROM encounters e
  WHERE COALESCE(e.encounter_voided, false) = false
  UNION ALL
  SELECT 'Order',
         COALESCE(o.date_activated, o.date_created, o.encounter_datetime),
         COALESCE(o.order_type_name, '(unknown)'),
         NULL,
         o.creator_uuid,
         o.patient_uuid,
         o.uuid
  FROM orders o
  WHERE COALESCE(o.voided, false) = false
    AND COALESCE(o.order_action, 'NEW') = 'NEW'
  UNION ALL
  SELECT 'Visit',
         v.date_started,
         COALESCE(v.type, '(unknown)'),
         v.location,
         v.creator_uuid,
         v.patient_uuid,
         v.visit_uuid
  FROM visits v
  WHERE COALESCE(v.visit_voided, false) = false
  UNION ALL
  SELECT 'Registration',
         p.date_created,
         'Patient registration',
         NULL,
         NULL,
         p.patient_uuid,
         p.patient_uuid
  FROM patients p
  WHERE COALESCE(p.person_voided, false) = false
