table_name: lab_orders
main_dttm_col: date_activated
description: 'Lab test orders joined with patient demographics (issue #210)'
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: |-
  SELECT
      o.order_id,
      o.order_number,
      o.accession_number,
      o.order_name AS test_name,
      o.date_activated,
      o.date_stopped,
      o.order_action,
      o.care_setting_name,
      o.encounter_datetime,
      p.patient_id,
      p.identifiers,
      CONCAT_WS(' ', p.given_name, p.family_name) AS patient_name,
      p.gender,
      p.birthdate,
      FLOOR(EXTRACT(EPOCH FROM (o.date_activated - CAST(p.birthdate AS TIMESTAMP))) / 31557600) AS age_at_order,
      p.address_city AS origin_city,
      p.address_county_district AS origin_district,
      p.address_state_province AS origin_province,
      p.address_country AS origin_country
  FROM orders o
  LEFT JOIN patients p ON p.patient_uuid = o.patient_uuid
  WHERE o.order_type_name = 'Test Order'
    AND o.voided = false
