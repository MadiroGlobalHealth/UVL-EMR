table_name: lab_results
main_dttm_col: obs_date_time
description: 'Lab test results (observations for concepts that have been ordered as lab tests) joined with patient demographics (issue #210)'
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: |-
  SELECT
      obs.obs_id,
      obs.obs_date_time,
      obs.question_label AS test_name,
      COALESCE(obs.answer_coded, CAST(obs.answer_numeric AS VARCHAR), obs.answer_text, CAST(obs.answer_datetime AS VARCHAR)) AS result,
      obs.answer_numeric,
      obs.location,
      obs.encounter_type,
      p.patient_id,
      p.identifiers,
      CONCAT_WS(' ', p.given_name, p.family_name) AS patient_name,
      p.gender,
      FLOOR(EXTRACT(EPOCH FROM (obs.obs_date_time - CAST(p.birthdate AS TIMESTAMP))) / 31557600) AS age_at_result,
      p.address_city AS origin_city,
      p.address_county_district AS origin_district,
      p.address_state_province AS origin_province
  FROM observations obs
  LEFT JOIN patients p ON p.patient_uuid = obs.patient_uuid
  WHERE obs.obs_voided = false
    AND (
      obs.question_uuid IN (
        SELECT DISTINCT concept_uuid FROM orders
        WHERE order_type_name = 'Test Order' AND voided = false
      )
      OR obs.obs_group_concept_uuid IN (
        SELECT DISTINCT concept_uuid FROM orders
        WHERE order_type_name = 'Test Order' AND voided = false
      )
    )
