table_name: PBF Registre Hospitalisation
main_dttm_col: DATE DE SORTIE
description: "UVL-EMR \xB7 PBF register \xAB JOURNEES D'HOSPITALISATION \xBB (Superset\
  \ virtual dataset)\nhttps://github.com/MadiroGlobalHealth/UVL-EMR/issues/587   (related\
  \ #583 #584 #582 #586)\nShape: one row per WARD STAY, i.e. per admission or intra-hospital\
  \ transfer\nrecorded with the ward (bed management) app, columns in the order of\
  \ the PBF\ntemplate sheet JOURNEES D'HOSPITALISATION, then a few extra columns.\n\
  \  * An Admission opens a stay in its ward; a Transfer closes the current ward\n\
  \    (EVOLUTION \xAB Transfert intra-hospitalier \xBB) and opens one in the receiving\n\
  \    ward (ORIGINE \xAB R\xE9f\xE9rence intra-hospitali\xE8re \xBB); a Discharge\
  \ closes the last.\n    So each ward counts its own days. ID SEJOUR groups the rows\
  \ of one stay.\nSources (UUIDs from the OpenMRS DB, 11 Nov 2026)\n  * ADT encounter\
  \ types: Admission e22e39fd-7db2-45e7-80f1-60fa0d5a4378,\n    Transfer d3b07384-8d1c-4e6b-9b8e-2f3b8e4a1c9f,\n\
  \    Discharge 181820aa-88c9-479b-9077-af92f5364329. Their location is the ward.\n\
  \    Paired within the same visit, in time order.\n  * EVOLUTION: F07 Discharge\
  \ Summary (encounter type 669262a8\u2026, form\n    83e1f63e\u2026), question CIEL\
  \ 160433 \xAB \xC9volution \xE0 la sortie \xBB (#583), mapped\n    by answer UUID\
  \ to the Ministry wording. Deaths (fixed 16 Nov 2026): the form saves\n    \xAB\
  \ Death within 24 hours of admission \xBB 2071f21d\u2026 / \xAB Death after 24 hours\
  \ of\n    admission \xBB 442b409b\u2026; the older \xAB Deceased \xBB 5f60e9b0\u2026\
  \ is still read.\n  * ORIGINE: visit attribute \xAB Origin \xBB (4dfdd31b\u2026\
  ), else the Contact form's\n    \xAB Patient Origin \xBB obs (c110605a\u2026) in\
  \ the same visit.\n  * CIM10_ENTREE: diagnoses on the F04 Admission Note (form name\
  \ \xAB Admission Note \xBB;\n    form uuid 724a6640\u2026 on one server, 1ff8b50b\u2026\
  \ on UAT) of the\n    stay, else those of the last consultation of the visit before\
  \ admission.\n    CIM10_SORTIE: diagnoses on the stay's F07. ICD-10 from the diagnosis\n\
  \    concept's \xAB ICD-10-WHO: X \xBB mapping (#584).\n  * ASSURANCE / ASSURANCE\
  \ COMPLEMENTAIRE: visit attributes Payer /\n    Supplementary insurance (parsed\
  \ by name, as in the consultation register).\n  * NUMERO_ASSURANCE: person attribute\
  \ \xAB Num\xE9ro de carte d'assurance \xBB (#582).\n  * Test patients excluded (SYNTH-\
  \ / E2E / QA / TEST / DEMO names, voided\n    persons, the \"Locations test\" location).\n\
  \  * Month filter: \xAB DATE DE SORTIE \xBB (the stay's days are known at exit);\
  \ rows\n    with no DATE DE SORTIE are patients still in the ward.\n  * DUREE =\
  \ DATE DE SORTIE \u2212 DATE D'ENTREE in calendar days, minimum 1.\n  * Exit of\
  \ a ward stay: the next ADT event of the visit, else the F07, else the end of the\n\
  \    visit (fixed 17 Nov 2026: a visit closed without a Discharge left the stay\
  \ open forever).\n(Full annotated SQL: e2e/superset/<register>.annotated.sql; stored\
  \ SQL is comment-free for speed, 17 Nov 2026.)\n17 Nov 2026 (no N/A): empty text\
  \ cells show \xAB Sans assurance \xBB (no payer / no card for Cash, Mobile Money,\
  \ Free healthcare), \xAB Non applicable \xBB, \xAB En cours \xBB (open stay), \xAB\
  \ Aucun \xBB (no special status), else \xAB Non renseign\xE9 \xBB; counts show 0."
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: "WITH adt AS (\n    SELECT\n        e.encounter_id,\n        e.visit_uuid,\n\
  \        e.patient_uuid,\n        e.encounter_datetime,\n        e.location AS ward,\n\
  \        e.location_uuid AS ward_uuid,\n        CASE e.encounter_type_uuid\n   \
  \         WHEN 'e22e39fd-7db2-45e7-80f1-60fa0d5a4378' THEN 'A'\n            WHEN\
  \ 'd3b07384-8d1c-4e6b-9b8e-2f3b8e4a1c9f' THEN 'T'\n            WHEN '181820aa-88c9-479b-9077-af92f5364329'\
  \ THEN 'D'\n        END AS kind\n    FROM encounters e\n    WHERE e.encounter_type_uuid\
  \ IN ('e22e39fd-7db2-45e7-80f1-60fa0d5a4378',\n                                \
  \    'd3b07384-8d1c-4e6b-9b8e-2f3b8e4a1c9f',\n                                 \
  \   '181820aa-88c9-479b-9077-af92f5364329')\n      AND COALESCE(e.encounter_voided,\
  \ false) = false\n      AND e.location_uuid IS DISTINCT FROM '450be362-59a7-4ccd-964d-ebd930a8b30f'\n\
  ),\nadt_seq AS (\n    SELECT\n        a.*,\n        LEAD(a.kind) OVER w AS next_kind,\n\
  \        LEAD(a.encounter_datetime) OVER w AS next_datetime,\n        SUM(CASE WHEN\
  \ a.kind = 'A' THEN 1 ELSE 0 END) OVER w AS stay_no\n    FROM adt a\n    WINDOW\
  \ w AS (PARTITION BY a.visit_uuid ORDER BY a.encounter_datetime, a.encounter_id)\n\
  ),\nseg AS (\n    SELECT\n        s.*,\n        FIRST_VALUE(s.encounter_id) OVER\
  \ st AS stay_id,\n        FIRST_VALUE(s.encounter_datetime) OVER st AS stay_start\n\
  \    FROM adt_seq s\n    WINDOW st AS (PARTITION BY s.visit_uuid, s.stay_no ORDER\
  \ BY s.encounter_datetime, s.encounter_id)\n),\nstays AS (\n    SELECT\n       \
  \ g.*,\n        (SELECT MIN(x.encounter_datetime) FROM adt x\n          WHERE x.visit_uuid\
  \ = g.visit_uuid AND x.kind = 'A'\n            AND x.encounter_datetime > g.stay_start)\
  \ AS next_stay_start\n    FROM seg g\n    WHERE g.kind IN ('A', 'T') AND g.stay_no\
  \ > 0\n),\nf07 AS (\n    SELECT DISTINCT ON (s.stay_id)\n        s.stay_id,\n  \
  \      e.encounter_id AS f07_encounter_id,\n        e.encounter_uuid AS f07_encounter_uuid,\n\
  \        e.encounter_datetime AS f07_datetime\n    FROM (SELECT DISTINCT stay_id,\
  \ visit_uuid, stay_start, next_stay_start FROM stays) s\n    JOIN encounters e\n\
  \      ON e.visit_uuid = s.visit_uuid\n     AND e.encounter_type_uuid = '669262a8-f351-4d5b-8480-3551734eed8f'\n\
  \     AND COALESCE(e.encounter_voided, false) = false\n     AND e.encounter_datetime\
  \ >= s.stay_start - INTERVAL '1 day'\n     AND (s.next_stay_start IS NULL OR e.encounter_datetime\
  \ < s.next_stay_start)\n    ORDER BY s.stay_id, e.encounter_datetime DESC, e.encounter_id\
  \ DESC\n),\nf07_outcome AS (\n    SELECT DISTINCT ON (f.stay_id)\n        f.stay_id,\n\
  \        o.answer_coded_uuid AS outcome_uuid,\n        o.answer_coded AS outcome_name\n\
  \    FROM f07 f\n    JOIN observations o\n      ON o.encounter_uuid = f.f07_encounter_uuid\n\
  \     AND o.question_uuid = '160433AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'\n     AND COALESCE(o.obs_voided,\
  \ false) = false\n    ORDER BY f.stay_id, o.obs_date_time DESC\n),\nenc_dx AS (\n\
  \    SELECT\n        ed.encounter_id,\n        STRING_AGG(DISTINCT COALESCE(c.name,\
  \ ed.diagnosis_non_coded), '; ') AS dx_names,\n        STRING_AGG(DISTINCT TRIM(SUBSTRING(c.concept_mappings_source_codes\n\
  \                                           FROM 'ICD-10-WHO: ([^,]+)')), '; ')\
  \ AS icd10\n    FROM encounter_diagnoses ed\n    LEFT JOIN concepts c\n        \
  \   ON c.concept_id = ed.diagnosis_coded\n          AND c.locale = 'en'\n    WHERE\
  \ COALESCE(ed.voided, false) = false\n      AND ed.encounter_id IN (SELECT e.encounter_id\
  \ FROM encounters e\n                               WHERE e.visit_uuid IN (SELECT\
  \ visit_uuid FROM stays))\n    GROUP BY ed.encounter_id\n),\nentry_dx AS (\n   \
  \ SELECT DISTINCT ON (s.stay_id)\n        s.stay_id,\n        d.dx_names,\n    \
  \    d.icd10\n    FROM (SELECT DISTINCT stay_id, visit_uuid, stay_start, next_stay_start\
  \ FROM stays) s\n    JOIN encounters e\n      ON e.visit_uuid = s.visit_uuid\n \
  \    AND COALESCE(e.encounter_voided, false) = false\n    JOIN enc_dx d ON d.encounter_id\
  \ = e.encounter_id\n    WHERE ((e.form_uuid IN ('724a6640-3f2d-47f5-9cde-758cb45e955b',\
  \ '1ff8b50b-68d7-3126-822d-272938877268') OR e.form_name ILIKE '%Admission Note%')\n\
  \           AND e.encounter_datetime >= s.stay_start - INTERVAL '1 day'\n      \
  \     AND (s.next_stay_start IS NULL OR e.encounter_datetime < s.next_stay_start))\n\
  \       OR (e.encounter_type_uuid IN ('0ff55309-1897-476b-a647-c7c180b102c8',\n\
  \                                     '43f383ec-90fd-4273-be45-9c1906dda9aa')\n\
  \           AND e.encounter_datetime <= s.stay_start)\n    ORDER BY s.stay_id,\n\
  \             COALESCE((e.form_uuid IN ('724a6640-3f2d-47f5-9cde-758cb45e955b',\
  \ '1ff8b50b-68d7-3126-822d-272938877268') OR e.form_name ILIKE '%Admission Note%'),\
  \ false) DESC,\n             CASE WHEN (e.form_uuid IN ('724a6640-3f2d-47f5-9cde-758cb45e955b',\
  \ '1ff8b50b-68d7-3126-822d-272938877268') OR e.form_name ILIKE '%Admission Note%')\n\
  \                  THEN e.encounter_datetime END ASC,\n             e.encounter_datetime\
  \ DESC\n),\ncontact_origin AS (\n    SELECT DISTINCT ON (o.visit_uuid)\n       \
  \ o.visit_uuid,\n        o.answer_coded_uuid AS origin_uuid\n    FROM observations\
  \ o\n    WHERE o.question_uuid = 'c110605a-e601-40bc-ae07-e1f261d317fa'\n      AND\
  \ COALESCE(o.obs_voided, false) = false\n      AND o.visit_uuid IN (SELECT visit_uuid\
  \ FROM stays)\n    ORDER BY o.visit_uuid, o.obs_date_time DESC\n),\nbase AS (\n\
  \    SELECT\n        s.*,\n        f.f07_datetime,\n        fo.outcome_uuid,\n \
  \       fo.outcome_name,\n        v.visit_attributes,\n        v.date_stopped AS\
  \ visit_stopped,\n        co.origin_uuid AS contact_origin_uuid,\n        p.given_name,\n\
  \        p.family_name,\n        p.identifiers,\n        p.attributes AS person_attributes,\n\
  \        COALESCE(p.gender, v.patient_gender) AS gender,\n        COALESCE(p.birthdate,\
  \ v.patient_birthdate) AS birthdate,\n        p.address_state_province AS province,\n\
  \        p.address_county_district AS commune,\n        p.address_city AS zone,\n\
  \        p.address_1 AS colline\n    FROM stays s\n    LEFT JOIN f07 f ON f.stay_id\
  \ = s.stay_id\n    LEFT JOIN f07_outcome fo ON fo.stay_id = s.stay_id\n    LEFT\
  \ JOIN visits v ON v.visit_uuid = s.visit_uuid\n    LEFT JOIN contact_origin co\
  \ ON co.visit_uuid = s.visit_uuid\n    JOIN patients p ON p.patient_uuid = s.patient_uuid\n\
  \    WHERE COALESCE(v.visit_voided, false) = false\n      AND COALESCE(p.person_voided,\
  \ false) = false\n      AND NOT (COALESCE(p.family_name, '') ~* '^(SYNTH-|E2E|QA|TEST|DEMO)'\n\
  \            OR COALESCE(p.given_name,  '') ~* '^(SYNTH-|E2E|QA|TEST|DEMO)')\n),\n\
  calc AS (\n    SELECT\n        b.*,\n        NULLIF(TRIM(SUBSTRING(b.visit_attributes\
  \ FROM '(?:^|/ )Origin: ((?:[^/]|/(?! ))*)')), '') AS origin_attr,\n        NULLIF(TRIM(SUBSTRING(b.visit_attributes\
  \ FROM '(?:^|/ )Payer: ((?:[^/]|/(?! ))*)')), '') AS payer,\n        NULLIF(TRIM(SUBSTRING(b.visit_attributes\
  \ FROM '(?:^|/ )Supplementary insurance: ((?:[^/]|/(?! ))*)')), '') AS supp_insurance,\n\
  \        CASE\n            WHEN b.next_kind IN ('T', 'D', 'A') THEN b.next_datetime\n\
  \            WHEN b.next_kind IS NULL AND b.f07_datetime >= b.encounter_datetime\n\
  \                 THEN b.f07_datetime\n            WHEN b.next_kind IS NULL AND\
  \ b.visit_stopped >= b.encounter_datetime\n                 THEN b.visit_stopped\n\
  \        END AS exit_datetime\n    FROM base b\n)\n,\nres AS (\nSELECT\n    COALESCE(\n\
  \        TRIM(SPLIT_PART(SUBSTRING(c.identifiers FROM 'UVL ID: ([^,]+)'), ',', 1)),\n\
  \        TRIM(SPLIT_PART(SUBSTRING(c.identifiers FROM 'Legacy ID: ([^,]+)'), ',',\
  \ 1))\n    ) AS \"IDPERSONNE\",\n    c.family_name AS \"NOM\",\n    c.given_name\
  \ AS \"PRENOM\",\n    c.gender AS \"SEXE\",\n    c.birthdate AS \"NAISSANCE\",\n\
  \    DATE_PART('year', AGE(c.encounter_datetime::date, c.birthdate))::int AS \"\
  AGE\",\n    c.province AS \"PROVINCE\",\n    c.commune AS \"COMMUNE\",\n    c.zone\
  \ AS \"ZONE\",\n    c.colline AS \"COLLINE\",\n    c.encounter_datetime::date AS\
  \ \"DATE D'ENTREE\",\n    CASE\n        WHEN c.kind = 'T' THEN 'R\xE9f\xE9rence\
  \ intra-hospitali\xE8re'\n        ELSE CASE COALESCE(\n                 CASE c.origin_attr\n\
  \                     WHEN 'Home' THEN '7282deba-8db9-4b83-b0a9-799b7a91f9da'\n\
  \                     WHEN 'Referred by Health Center (CDS)' THEN 'aa4aba23-865b-4b95-98b1-6abb86126b09'\n\
  \                     WHEN 'Referred by Another Hospital' THEN '1cf31ac9-1763-4f89-836b-078d0afd79a1'\n\
  \                     WHEN 'Intra-Hospital Referral (Consultation/Other Department)'\n\
  \                                                            THEN '497a7e30-5757-4a0a-85da-4d14520969bf'\n\
  \                 END, c.contact_origin_uuid)\n                 WHEN '7282deba-8db9-4b83-b0a9-799b7a91f9da'\
  \ THEN 'Domicile'\n                 WHEN 'aa4aba23-865b-4b95-98b1-6abb86126b09'\
  \ THEN 'R\xE9f\xE9r\xE9 par CDS'\n                 WHEN '1cf31ac9-1763-4f89-836b-078d0afd79a1'\
  \ THEN 'Autre h\xF4pital'\n                 WHEN '497a7e30-5757-4a0a-85da-4d14520969bf'\
  \ THEN 'R\xE9f\xE9rence intra-hospitali\xE8re'\n                 ELSE c.origin_attr\n\
  \             END\n    END AS \"ORIGINE\",\n    c.exit_datetime::date AS \"DATE\
  \ DE SORTIE\",\n    CASE WHEN c.exit_datetime IS NOT NULL\n         THEN GREATEST(c.exit_datetime::date\
  \ - c.encounter_datetime::date, 1) END AS \"DUREE\",\n    CASE\n        WHEN c.next_kind\
  \ = 'T' THEN 'Transfert intra-hospitalier'\n        WHEN c.exit_datetime IS NULL\
  \ THEN NULL\n        ELSE CASE c.outcome_uuid\n                 WHEN '55fd8787-27f2-456b-9f6b-acfc8d4ca8de'\
  \ THEN 'Gu\xE9ri'\n                 WHEN '162677AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'\
  \ THEN 'Am\xE9lior\xE9'\n                 WHEN 'ac0a6887-a5b5-4280-ae12-4f038163ce3d'\
  \ THEN 'Contre-r\xE9f\xE9rence'\n                 WHEN '4ae2adeb-1e81-410d-9b08-2fcbba6397a2'\
  \ THEN 'R\xE9f\xE9rence m\xEAme niveau'\n                 WHEN '96cbc3ff-8ff8-4b3c-b341-815563df3641'\
  \ THEN 'R\xE9f\xE9rence niveau sup\xE9rieur'\n                 WHEN '6844c0b2-a503-4a12-9991-cf56062cfb50'\
  \ THEN 'Transfert intra-hospitalier'\n                 WHEN '1694AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'\
  \ THEN 'Sortie contre avis m\xE9dical (d\xE9charge)'\n                 WHEN '160431AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'\
  \ THEN '\xC9vad\xE9'\n                 WHEN '2071f21d-0ad9-42c7-908c-f5ff0efa034b'\
  \ THEN 'D\xE9c\xE9d\xE9 (avant 24 h)'\n                 WHEN '442b409b-705f-4374-ae49-44ce83053209'\
  \ THEN 'D\xE9c\xE9d\xE9 (apr\xE8s 24 h)'\n                 WHEN '5f60e9b0-50e1-473c-b155-68a2a670559e'\
  \ THEN 'D\xE9c\xE9d\xE9'\n                 ELSE c.outcome_name\n             END\n\
  \    END AS \"EVOLUTION\",\n    dxi.icd10 AS \"CIM10_ENTREE\",\n    dxo.icd10 AS\
  \ \"CIM10_SORTIE\",\n    c.payer AS \"ASSURANCE\",\n    NULLIF(TRIM(SUBSTRING(c.person_attributes\
  \ FROM '(?:^|/ )Num\xE9ro de carte d''assurance: ((?:[^/]|/(?! ))*)')), '') AS \"\
  NUMERO_ASSURANCE\",\n    c.supp_insurance AS \"ASSURANCE COMPLEMENTAIRE\",\n   \
  \ c.ward AS \"SERVICE D'HOSPITALISATION\",\n    dxi.dx_names AS \"DIAGNOSTIC D'ENTREE\"\
  ,\n    dxo.dx_names AS \"DIAGNOSTIC DE SORTIE\",\n    CASE c.kind WHEN 'A' THEN\
  \ 'Admission' WHEN 'T' THEN 'Transfert' END AS \"MOUVEMENT\",\n    c.stay_id AS\
  \ \"ID SEJOUR\",\n    c.encounter_id AS \"ID MOUVEMENT\"\nFROM calc c\nLEFT JOIN\
  \ entry_dx dxi ON dxi.stay_id = c.stay_id\nLEFT JOIN f07 f ON f.stay_id = c.stay_id\n\
  LEFT JOIN enc_dx dxo ON dxo.encounter_id = f.f07_encounter_id\n                \
  \      AND c.next_kind IS DISTINCT FROM 'T'\n)\nSELECT\n    COALESCE(r.\"IDPERSONNE\"\
  , 'Non renseign\xE9')\n        AS \"IDPERSONNE\",\n    COALESCE(r.\"NOM\", 'Non\
  \ renseign\xE9')\n        AS \"NOM\",\n    COALESCE(r.\"PRENOM\", 'Non renseign\xE9\
  ')\n        AS \"PRENOM\",\n    COALESCE(r.\"SEXE\", 'Non renseign\xE9')\n     \
  \   AS \"SEXE\",\n    r.\"NAISSANCE\"\n        AS \"NAISSANCE\",\n    r.\"AGE\"\n\
  \        AS \"AGE\",\n    COALESCE(r.\"PROVINCE\", 'Non renseign\xE9')\n       \
  \ AS \"PROVINCE\",\n    COALESCE(r.\"COMMUNE\", 'Non renseign\xE9')\n        AS\
  \ \"COMMUNE\",\n    COALESCE(r.\"ZONE\", 'Non renseign\xE9')\n        AS \"ZONE\"\
  ,\n    COALESCE(r.\"COLLINE\", 'Non renseign\xE9')\n        AS \"COLLINE\",\n  \
  \  r.\"DATE D'ENTREE\"\n        AS \"DATE D'ENTREE\",\n    COALESCE(r.\"ORIGINE\"\
  , 'Non renseign\xE9')\n        AS \"ORIGINE\",\n    r.\"DATE DE SORTIE\"\n     \
  \   AS \"DATE DE SORTIE\",\n    r.\"DUREE\"\n        AS \"DUREE\",\n    CASE WHEN\
  \ r.\"EVOLUTION\" IS NOT NULL THEN r.\"EVOLUTION\"\n         WHEN r.\"DATE DE SORTIE\"\
  \ IS NULL THEN 'En cours'\n         ELSE 'Non renseign\xE9' END\n        AS \"EVOLUTION\"\
  ,\n    COALESCE(r.\"CIM10_ENTREE\", 'Non renseign\xE9')\n        AS \"CIM10_ENTREE\"\
  ,\n    CASE WHEN r.\"CIM10_SORTIE\" IS NOT NULL THEN r.\"CIM10_SORTIE\"\n      \
  \   WHEN r.\"DATE DE SORTIE\" IS NULL THEN 'En cours'\n         WHEN r.\"EVOLUTION\"\
  \ = 'Transfert intra-hospitalier' THEN 'Non applicable'\n         ELSE 'Non renseign\xE9\
  ' END\n        AS \"CIM10_SORTIE\",\n    COALESCE(r.\"ASSURANCE\", 'Sans assurance')\n\
  \        AS \"ASSURANCE\",\n    CASE WHEN r.\"NUMERO_ASSURANCE\" IS NOT NULL THEN\
  \ r.\"NUMERO_ASSURANCE\"\n         WHEN COALESCE(r.\"ASSURANCE\", '') IN ('', 'Cash',\
  \ 'Mobile Money', 'Free healthcare') THEN 'Sans assurance'\n         ELSE 'Non renseign\xE9\
  ' END\n        AS \"NUMERO_ASSURANCE\",\n    COALESCE(r.\"ASSURANCE COMPLEMENTAIRE\"\
  , 'Sans assurance')\n        AS \"ASSURANCE COMPLEMENTAIRE\",\n    COALESCE(r.\"\
  SERVICE D'HOSPITALISATION\", 'Non renseign\xE9')\n        AS \"SERVICE D'HOSPITALISATION\"\
  ,\n    COALESCE(r.\"DIAGNOSTIC D'ENTREE\", 'Non renseign\xE9')\n        AS \"DIAGNOSTIC\
  \ D'ENTREE\",\n    CASE WHEN r.\"DIAGNOSTIC DE SORTIE\" IS NOT NULL THEN r.\"DIAGNOSTIC\
  \ DE SORTIE\"\n         WHEN r.\"DATE DE SORTIE\" IS NULL THEN 'En cours'\n    \
  \     WHEN r.\"EVOLUTION\" = 'Transfert intra-hospitalier' THEN 'Non applicable'\n\
  \         ELSE 'Non renseign\xE9' END\n        AS \"DIAGNOSTIC DE SORTIE\",\n  \
  \  COALESCE(r.\"MOUVEMENT\", 'Non renseign\xE9')\n        AS \"MOUVEMENT\",\n  \
  \  r.\"ID SEJOUR\"\n        AS \"ID SEJOUR\",\n    r.\"ID MOUVEMENT\"\n        AS\
  \ \"ID MOUVEMENT\"\nFROM res r\nORDER BY \"DATE D'ENTREE\" DESC, \"ID MOUVEMENT\"\
  \n"
