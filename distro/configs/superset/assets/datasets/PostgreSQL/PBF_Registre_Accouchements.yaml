table_name: PBF Registre Accouchements
main_dttm_col: DATE D'ACCOUCHEMENT
description: "UVL-EMR \xB7 PBF register \xAB ACCOUCHEMENTS \xBB (Superset virtual\
  \ dataset)\nhttps://github.com/MadiroGlobalHealth/UVL-EMR/issues/588   (related\
  \ #586 #587 #582)\nShape: one row per delivery encounter (UVL Delivery Registration\
  \ form, else\nUVL Childbirth Record form), columns in the order of the PBF template.\n\
  Sources (13 Nov 2026). The analytics DB has no delivery encounter yet, so the\n\
  encounter is selected by FORM NAME and the questions by the concept UUIDs found\n\
  in the analytics \xAB concepts \xBB table (to re-check once the first deliveries\
  \ sync):\n  * Delivery encounter: encounters.form_name ILIKE '%Delivery Registration%'\n\
  \    or '%Childbirth Record%'. Several forms in the same visit = one delivery\n\
  \    (Delivery Registration preferred, earliest).\n  * DATE D'ADMISSION: latest\
  \ ADT Admission (e22e39fd-7db2-45e7-80f1-60fa0d5a4378)\n    of the same visit at\
  \ or before the delivery; else the visit start.\n  * ACCOUCHE PAR: \xAB Delivery\
  \ performed by (profession) \xBB 0c26bb7d-11e0-4d5b-9238-b645f924f29d\n    (profession:\
  \ Nurse / Doctor / Midwife / Other; the person's name is not captured).\n  * TYPE\
  \ D'ACCOUCHEMENT (fixed 16 Nov 2026 after the UAT seed): C\xE9sarienne when\n  \
  \  \xAB Mode of delivery \xBB 38eca4cd-21ab-4689-a18b-202a50d34569 = Caesarean 4a8e5f2a-da35-4a5d-aefb-ffabe41e6783,\n\
  \    or a Procedure order GO101/GO102/GO103 (86a76e88\u2026 / 455d4174\u2026 / 6060ba72\u2026\
  ) exists in the visit,\n    or an Operation Protocol of the visit has \xAB Caesarean\
  \ section case \xBB 753be061\u2026 = programm\xE9e\n    79a559a9\u2026 / non programm\xE9\
  e 90a3cdc3\u2026 (#610: one row per delivery visit, never counted twice);\n    else\
  \ \xAB Mode of delivery \xBB 38eca4cd answers Dystocic b08d3e60-2e3c-4d23-906c-9e36cd222bea\
  \ /\n    Eutocic 3de182b6-f7fe-4185-a7b5-89237593c1f1; older form versions saved\
  \ those answers under\n    \xAB Other delivery procedures performed \xBB 6af027e5-8737-4ce0-8343-79b024cd1989\
  \ (still read).\n    Forceps and ventouse are dystocic deliveries (product owner,\
  \ 24 Nov 2026): \xAB Dystocique (forceps) \xBB,\n    \xAB Dystocique (ventouse)\
  \ \xBB. Read from the \xAB Mode of delivery \xBB answers Forceps fd601163\u2026\
  \ / Vacuum\n    extraction 628fd5bc\u2026 (form of 24 Nov 2026, #896, removed by\
  \ #922) and from the free text\n    \xAB Dystocia (specify type) \xBB fc343f72\u2026\
  \ (forceps: \xAB forc\u2026 \xBB; ventouse: \xAB ventous\u2026 \xBB / \xAB vacu\u2026\
  \ \xBB).\n  * DEROULEMENT: \xAB Delivery complications \xBB 5d214371-cf09-4589-b357-de8b091b66d3\
  \ (all answers).\n  * ISSUE NOUVEAU-NE: \xAB Stillbirth type \xBB 52325f44-b6dd-470b-a672-97fefbd119e1\
  \ (frais / mac\xE9r\xE9),\n    else \xAB Newborn status during postpartum monitoring\
  \ \xBB 238652d6-4aca-451a-9c8e-8336cea6fff4,\n    else \xAB Pregnancy outcome \xBB\
  \ cd96c0b6-a08f-49eb-94ad-9a914f1612f0 (the current form saves the\n    outcome\
  \ there: Liveborn 4056a982\u2026 / Stillbirth 63f4b85c\u2026).\n  * ASSURANCE /\
  \ ASSURANCE COMPLEMENTAIRE: visit attributes Payer / Supplementary insurance.\n\
  \  * CARTE: person attribute \xAB Num\xE9ro de carte d'assurance \xBB (#582).\n\
  \  * SERVICE: the delivery encounter's location (#222).\n  * Test patients excluded\
  \ (SYNTH- / E2E / QA / TEST / DEMO, voided persons,\n    \xAB Locations test \xBB\
  \ 450be362-59a7-4ccd-964d-ebd930a8b30f).\n(Full annotated SQL: e2e/superset/<register>.annotated.sql;\
  \ stored SQL is comment-free for speed, 17 Nov 2026.)\n17 Nov 2026: ISSUE NOUVEAU-NE\
  \ has one outcome per newborn (each newborn obs group), joined with \xAB ; \xBB\
  \ (twins: \xAB Vivant; Mort-n\xE9 mac\xE9r\xE9 \xBB); extra columns NAISSANCES and\
  \ NES VIVANTS. A delivery stays one row.\n17 Nov 2026 (no N/A): empty text cells\
  \ show \xAB Sans assurance \xBB (no payer / no card for Cash, Mobile Money, Free\
  \ healthcare), \xAB Non applicable \xBB, \xAB En cours \xBB (open stay), \xAB Aucun\
  \ \xBB (no special status), else \xAB Non renseign\xE9 \xBB; counts show 0."
