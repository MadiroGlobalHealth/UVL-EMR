table_name: PBF Registre Chirurgie
main_dttm_col: DATE
description: "UVL-EMR \xB7 PBF register \xAB CHIRURGIE \xBB (Superset virtual dataset)\n\
  https://github.com/MadiroGlobalHealth/UVL-EMR/issues/589   (related #586 #587 #582)\n\
  Shape: one row per operation (UVL Operation Protocol form encounter), columns in\n\
  the order of the PBF template.\nSources (13 Nov 2026). The analytics DB has no Operation\
  \ Protocol encounter yet,\nso the encounter is selected by FORM NAME and the questions\
  \ by the concept UUIDs\nfound in the analytics \xAB concepts \xBB table (to re-check\
  \ once the first operations sync):\n  * Operation encounter: encounter type Operation\
  \ Protocol 090a9937-0fb4-4a0e-9487-96ec0c3f9a38,\n    or encounters.form_name ILIKE\
  \ '%Operation Protocol%'.\n  * TYPE D'INTERVENTION: obs \xAB Procedure performed\
  \ (text) \xBB 1cb8cdd5-2ca4-4ace-b1ff-eef6e59a7811\n    or \xAB Procedure \xBB 27fe6714-0bc6-4435-adb0-818538abe42c\
  \ in the encounter; else the\n    surgical Procedure orders (order type 67a92e56-0f88-11ea-8d71-362b9e155667,\
  \ PBF code\n    with hundreds digit 1-3, e.g. \xAB GO101 - Cesarean section \xBB\
  ) of the same encounter,\n    else of the same visit.\n  * TYPE DE CHIRURGIE: from\
  \ that PBF procedure code: x1xx = Majeure, x2xx = Interm\xE9diaire,\n    x3xx =\
  \ Mineure (the nomenclature's \xAB Other major / intermediate / minor \u2026 surgery\
  \ \xBB).\n    Empty when only a free-text procedure is recorded.\n  * TYPE D'ANESTHESIE:\
  \ \xAB Anaesthesia type (general, loco-regional, local) \xBB\n    e56083c5-658e-4715-85ce-30cd78e0b13b,\
  \ else \xAB Anesthesia Type \xBB 3017f680-5c3c-4f7b-94e1-6afda9e07eaf.\n    Labelled\
  \ in French by answer UUID (fixed 16 Nov 2026: \xAB Locale \xBB 6e625252\u2026 has\
  \ no English\n    name, so the analytics answer name is empty for it).\n  * CHIRURGIEN:\
  \ \xAB Surgeon (staff member) \xBB 231dd950-8985-4685-91a1-fce38060d57c (current\
  \ form),\n    else \xAB Surgeon name \xBB 9b01093f-21cc-4723-9ea4-88edfa8fccb8,\
  \ else \xAB Surgeon \xBB\n    0b21ca75-2fab-4c34-bf4c-f66ae2415829.\n  * CIM10 /\
  \ DIAGNOSTIC: diagnoses on the operation encounter, else on the latest\n    consultation\
  \ of the visit before it (Outpatient 0ff55309\u2026 / Inpatient 43f383ec\u2026),\n\
  \    else the consultation of the visit closest in time (fixed 16 Nov 2026: the\
  \ form's\n    date field can save the operation at 00:00, before the same-day consultation);\n\
  \    ICD-10 from the diagnosis concept's \xAB ICD-10-WHO: X \xBB mapping (#584).\n\
  \  * ASSURANCE / ASSURANCE COMPLEMENTAIRE: visit attributes Payer / Supplementary\
  \ insurance.\n  * CARTE: person attribute \xAB Num\xE9ro de carte d'assurance \xBB\
  \ (#582).\n  * SERVICE: \xAB Bloc op\xE9ratoire \xBB for every Operation Protocol\
  \ encounter (fixed 16 Nov 2026:\n    since #691 the form is saved at the visit's\
  \ location, so the location is never the\n    theatre). The location where it was\
  \ saved is kept in \xAB LIEU D'ENREGISTREMENT \xBB.\n  * Test patients excluded\
  \ (SYNTH- / E2E / QA / TEST / DEMO, voided persons,\n    \xAB Locations test \xBB\
  \ 450be362-59a7-4ccd-964d-ebd930a8b30f).\n(Full annotated SQL: e2e/superset/<register>.annotated.sql;\
  \ stored SQL is comment-free for speed, 17 Nov 2026.)\n17 Nov 2026: several answers\
  \ to a question are joined with \xAB + \xBB (e.g. \xAB Bloc nerveux p\xE9riph\xE9\
  rique + S\xE9dation \xBB).\n17 Nov 2026 (no N/A): empty text cells show \xAB Sans\
  \ assurance \xBB (no payer / no card for Cash, Mobile Money, Free healthcare), \xAB\
  \ Non applicable \xBB, \xAB En cours \xBB (open stay), \xAB Aucun \xBB (no special\
  \ status), else \xAB Non renseign\xE9 \xBB; counts show 0.\n17 Nov 2026 (providers):\
  \ CHIRURGIEN = the surgeon staff member's name from the analytics \xAB providers\
  \ \xBB table (pipeline change 17 Nov 2026)."
