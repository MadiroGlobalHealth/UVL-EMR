table_name: lab_orders
main_dttm_col: encounter_datetime
description: null
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: 'SELECT o.order_id, o.encounter_datetime, o.order_name AS test_name, o.care_setting_name,
  o.orderer AS orderer_id, o.patient_uuid, replace(p.identifiers,''UVL ID: '','''')
  AS patient_id, p.gender, p.birthdate, date_part(''year'', age(o.encounter_datetime,
  p.birthdate))::int AS age_years, CASE WHEN date_part(''year'', age(o.encounter_datetime,
  p.birthdate)) < 1 THEN ''<1'' WHEN date_part(''year'', age(o.encounter_datetime,
  p.birthdate)) < 5 THEN ''1-4'' WHEN date_part(''year'', age(o.encounter_datetime,
  p.birthdate)) < 15 THEN ''5-14'' WHEN date_part(''year'', age(o.encounter_datetime,
  p.birthdate)) < 25 THEN ''15-24'' WHEN date_part(''year'', age(o.encounter_datetime,
  p.birthdate)) < 50 THEN ''25-49'' WHEN date_part(''year'', age(o.encounter_datetime,
  p.birthdate)) < 65 THEN ''50-64'' ELSE ''65+'' END AS age_group, p.address_city
  FROM orders o LEFT JOIN patients p ON p.patient_uuid=o.patient_uuid WHERE o.order_type_name=''Test
  Order'' AND COALESCE(o.voided,false)=false'
