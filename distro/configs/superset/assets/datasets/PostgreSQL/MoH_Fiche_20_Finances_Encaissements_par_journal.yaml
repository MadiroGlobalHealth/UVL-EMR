table_name: MoH Fiche 20 Finances Encaissements par journal
main_dttm_col: MOIS
description: "UVL-EMR \xB7 Minist\xE8re \xAB Fiche 20 \xBB (#910), section 7.3 Gestion\
  \ financi\xE8re: encaissements du mois par caisse et par banque (paiements clients\
  \ valid\xE9s, date de paiement r\xE9elle). Les soldes d'ouverture et de cl\xF4ture\
  \ ne sont pas enregistr\xE9s dans Odoo."
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: "-- Fiche 20 (MoH, #910): 7.3 Gestion financiere, encaissements par caisse et\
  \ par banque (flux du mois)\n-- One row per MOIS x journal de paiement. Source:\
  \ payments POSTED, inbound, customer (real payment date). Draft payments are not\
  \ counted.\n-- Opening and closing balances of the cash desks and the bank (livre\
  \ de banque, caisse physique) are NOT recorded in Odoo: columns 'non enregistre'.\n\
  -- TEST DATA: payments of test patients (SYNTH-/E2E/QA/TEST/DEMO, through the patient\
  \ uuid kept as partner_ref) are left out.\nWITH test_pt AS (\n  SELECT p.patient_uuid\
  \ FROM patients p\n  WHERE COALESCE(p.family_name, '') ~* '^(SYNTH-|E2E|QA|TEST|DEMO)'\
  \ OR COALESCE(p.given_name, '') ~* '^(SYNTH-|E2E|QA|TEST|DEMO)'\n)\nSELECT date_trunc('month',\
  \ p.payment_date)::date AS \"MOIS\",\n       p.journal_code || ' - ' || COALESCE(j.name,\
  \ '') AS \"JOURNAL\",\n       CASE p.journal_type WHEN 'cash' THEN 'Caisse' WHEN\
  \ 'bank' THEN 'Banque' ELSE p.journal_type END AS \"TYPE\",\n       COUNT(*) AS\
  \ \"NB DE PAIEMENTS\",\n       ROUND(SUM(p.amount)::numeric, 2) AS \"MONTANT ENCAISSE\"\
  ,\n       COUNT(*) FILTER (WHERE NOT EXISTS (SELECT 1 FROM payment_allocations a\
  \ WHERE a.payment_id = p.payment_id)) AS \"DONT PAIEMENTS NON RAPPROCHES D'UNE FACTURE\"\
  ,\n       'non enregistr\xE9'::text AS \"SOLDE A L'OUVERTURE\",\n       'non enregistr\xE9\
  '::text AS \"SOLDE A LA CLOTURE\"\nFROM payments p\nLEFT JOIN journals j ON j.code\
  \ = p.journal_code\nWHERE p.state = 'posted' AND p.payment_type = 'inbound'\n  AND\
  \ NOT EXISTS (SELECT 1 FROM test_pt t WHERE t.patient_uuid = p.partner_ref)\nGROUP\
  \ BY 1, 2, 3\nORDER BY 1 DESC, 2\n"
