table_name: Patient Analytics Query V4
main_dttm_col: Date de visite
description: 'One row per visit: identity, address, clinical service point, doctors, diagnoses, orders,
  costs and payer (UVL-EMR#205, #222, #239)'
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: |-
  -- ============================================================================
  -- UVL-EMR Superset Visits Dashboard - V6 (dashboard 4, chart 22)
  -- #205 named columns, #222 clinical service point and treating doctor,
  -- #239 Chef de menage.
  --
  -- One row per visit (grain unchanged from V5). Changes from V5:
  --   * "Lieu" is renamed "Lieu d'accueil" (where the visit was opened). The new
  --     "Lieu de consultation" is the FBP service point: the location of the
  --     visit's Outpatient Consultation encounter, falling back to the Inpatient
  --     Consultation encounter. Tie-break when a visit has several: Outpatient
  --     before Inpatient, then the most recent encounter (#222).
  --   * "Lieux de soins" lists every encounter location in the visit, so a visit
  --     that went triage -> GP -> maternity can be read without changing the grain.
  --   * "Medecin traitant": provider(s) on that consultation encounter (#222).
  --     "Prescripteur(s)": orderer(s) of the visit's drug orders (#205).
  --     Both read the encounter_providers / providers analytics tables.
  --   * Identifiers are split by type from patients.identifiers
  --     ("type: value, type: value"): ID UVL, CNI Burundi, Legacy ID, OpenMRS ID (#205).
  --   * Visit attributes are split from visits.visit_attributes
  --     ("name: value / name: value"): Type de cas, Type de consultation,
  --     Categorie de maladie, Payeur (#205, #211, #327).
  --   * Person attributes are split from patients.attributes: Chef de menage
  --     (#239, attribute type c108c6bc-5f23-4e4a-ad34-8c788b86f288), Taux de couverture.
  --   * Patient first and last name (#205).
  --   * "Assurance" is the visit's Payer when recorded, else the Odoo pricelist
  --     (visits before #327). "Liste de prix Odoo" keeps the pricelist on its own.
  --     "Assurance complementaire" is the Payer when it is the supplementary
  --     insurance scheme; the complementary insurer's own name is not captured.
  --
  -- Recommended companion indexes (idempotent):
  --   CREATE INDEX IF NOT EXISTS idx_encounters_visit_uuid ON encounters(visit_uuid);
  --   CREATE INDEX IF NOT EXISTS idx_sol_customer_uuid     ON sale_order_lines(customer_uuid);
  --   CREATE INDEX IF NOT EXISTS idx_sol_product_ext_id    ON sale_order_lines(product_external_id);
  -- ============================================================================

  WITH visit_base AS (
      SELECT
          v.visit_id,
          CAST(v.date_started AS DATE)                    AS visit_date,
          v.location                                      AS visit_location,
          p.identifiers                                   AS identifiers,
          p.attributes                                    AS person_attributes,
          v.visit_attributes                              AS visit_attributes,
          NULLIF(CONCAT_WS(' ', p.given_name, p.middle_name), '') AS given_name,
          p.family_name                                   AS family_name,
          COALESCE(p.birthdate, v.patient_birthdate)      AS dob,
          COALESCE(CAST(v.patient_age_at_visit AS INT), NULL) AS age,
          COALESCE(p.gender, v.patient_gender)            AS gender,
          p.address_state_province                        AS province,   -- hierarchy level 2
          p.address_county_district                       AS commune,    -- hierarchy level 3
          p.address_city                                  AS zone,       -- hierarchy level 4 (city_village)
          p.address_1                                     AS colline,    -- hierarchy level 5 (address1)
          v.visit_uuid,
          v.patient_uuid
      FROM visits v
      LEFT JOIN patients p
          ON v.patient_uuid = p.patient_uuid
      WHERE COALESCE(v.visit_voided, false) = false
  ),

  -- patients.identifiers is "type: value, type: value" (LISTAGG in the flattening job).
  identifier_data AS (
      SELECT
          vb.visit_id,
          MAX(CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'uvl id'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END)            AS uvl_id,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'burundi cni'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS cni,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'legacy id'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS legacy_id,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'openmrs id'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS openmrs_id
      FROM visit_base vb
      CROSS JOIN LATERAL UNNEST(STRING_TO_ARRAY(vb.identifiers, ', ')) AS part
      WHERE POSITION(': ' IN part) > 0
      GROUP BY vb.visit_id
  ),

  -- patients.attributes is "name: value / name: value".
  person_attribute_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = LOWER('Chef de ménage')
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS chef_de_menage,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'insurance coverage tier'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS coverage_tier
      FROM visit_base vb
      CROSS JOIN LATERAL UNNEST(STRING_TO_ARRAY(vb.person_attributes, ' / ')) AS part
      WHERE POSITION(': ' IN part) > 0
      GROUP BY vb.visit_id
  ),

  -- visits.visit_attributes is "name: value / name: value".
  visit_attribute_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'case type'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS case_type,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'consultation type'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS consultation_type,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'disease category'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS disease_category,
          STRING_AGG(DISTINCT CASE WHEN LOWER(SPLIT_PART(part, ': ', 1)) = 'payer'
                   THEN SUBSTRING(part FROM POSITION(': ' IN part) + 2) END, '; ')      AS payer
      FROM visit_base vb
      CROSS JOIN LATERAL UNNEST(STRING_TO_ARRAY(vb.visit_attributes, ' / ')) AS part
      WHERE POSITION(': ' IN part) > 0
      GROUP BY vb.visit_id
  ),

  -- FBP service point (#222): the consultation encounter that counts for the visit.
  consultation_encounter AS (
      SELECT DISTINCT ON (vb.visit_id)
          vb.visit_id,
          e.location       AS consultation_location,
          e.encounter_uuid AS consultation_encounter_uuid
      FROM visit_base vb
      JOIN encounters e
          ON e.visit_uuid = vb.visit_uuid
          AND COALESCE(e.encounter_voided, false) = false
          AND e.encounter_type IN ('Outpatient Consultation', 'Inpatient Consultation')
      ORDER BY vb.visit_id,
               CASE WHEN e.encounter_type = 'Outpatient Consultation' THEN 0 ELSE 1 END,
               e.encounter_datetime DESC,
               e.encounter_id DESC
  ),

  treating_doctor_data AS (
      SELECT
          ce.visit_id,
          STRING_AGG(DISTINCT ep.provider_name, '; ') AS treating_doctor
      FROM consultation_encounter ce
      JOIN encounter_providers ep
          ON ep.encounter_uuid = ce.consultation_encounter_uuid
          AND COALESCE(ep.encounter_provider_voided, false) = false
      GROUP BY ce.visit_id
  ),

  pregnancy_status AS (
      SELECT
          vb.visit_id,
          CASE WHEN COUNT(o.obs_id) > 0 THEN 'Yes' ELSE '-' END AS pregnancy
      FROM visit_base vb
      LEFT JOIN observations o
          ON o.visit_uuid = vb.visit_uuid
          AND COALESCE(o.obs_voided, false) = false
          AND (
              o.question_label   ILIKE '%pregnan%'
              OR o.question_mapping ILIKE '%pregnan%'
              OR o.answer_text      ILIKE '%pregnan%'
          )
      GROUP BY vb.visit_id
  ),

  -- Chief complaint(s) captured during the visit (concept 'Chief complaint (text)').
  chief_complaint_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT COALESCE(o.answer_text, o.answer_coded), '; ') AS chief_complaints
      FROM visit_base vb
      JOIN observations o
          ON o.visit_uuid = vb.visit_uuid
          AND COALESCE(o.obs_voided, false) = false
          AND o.question_label ILIKE '%chief complaint%'
      GROUP BY vb.visit_id
  ),

  -- Birth certificate info (children) - free-text obs on concept 'Birth certificate',
  -- captured at registration (patient-scoped, so it shows on every visit row).
  birth_certificate_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT COALESCE(o.answer_text, o.answer_coded), '; ') AS birth_certificate
      FROM visit_base vb
      JOIN observations o
          ON o.patient_uuid = vb.patient_uuid
          AND COALESCE(o.obs_voided, false) = false
          AND o.question_label ILIKE 'birth certificate%'
      GROUP BY vb.visit_id
  ),

  encounter_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT e.encounter_type, ', ') AS encounter_list,
          COUNT(DISTINCT e.encounter_id)              AS encounter_count,
          STRING_AGG(DISTINCT e.location, ', ')       AS care_locations
      FROM visit_base vb
      LEFT JOIN encounters e
          ON e.visit_uuid = vb.visit_uuid
          AND COALESCE(e.encounter_voided, false) = false
      GROUP BY vb.visit_id
  ),

  diagnosis_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT COALESCE(c.name, ed.diagnosis_non_coded), '; ') AS diagnosis_list,
          COUNT(DISTINCT ed.diagnosis_id)                                     AS diagnosis_count,
          STRING_AGG(DISTINCT CASE
              WHEN UPPER(ed.certainty) = 'CONFIRMED'
              THEN COALESCE(c.name, ed.diagnosis_non_coded)
          END, '; ')                                                          AS confirmed_diagnosis_list,
          COUNT(DISTINCT CASE
              WHEN UPPER(ed.certainty) = 'CONFIRMED' THEN ed.diagnosis_id
          END)                                                                AS confirmed_diagnosis_count
      FROM visit_base vb
      LEFT JOIN encounters e
          ON e.visit_uuid = vb.visit_uuid
          AND COALESCE(e.encounter_voided, false) = false
      LEFT JOIN encounter_diagnoses ed
          ON ed.encounter_id = e.encounter_id
          AND COALESCE(ed.voided, false) = false
      LEFT JOIN concepts c
          ON c.concept_id = ed.diagnosis_coded
          AND COALESCE(c.retired, false) = false
          AND c.locale = 'en'
      GROUP BY vb.visit_id
  ),

  lab_test_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT COALESCE(c.name, o.order_name), '; ') AS lab_tests_list,
          COUNT(DISTINCT o.order_id)                                AS lab_test_count
      FROM visit_base vb
      LEFT JOIN encounters e
          ON e.visit_uuid = vb.visit_uuid
          AND COALESCE(e.encounter_voided, false) = false
      LEFT JOIN orders o
          ON o.encounter_uuid = e.encounter_uuid
          AND COALESCE(o.voided, false) = false
          AND o.order_type_name ILIKE '%test%'
          AND o.order_action NOT ILIKE '%DISCONTINUE%'
      LEFT JOIN concepts c
          ON c.uuid = o.concept_uuid
          AND COALESCE(c.retired, false) = false
          AND c.locale = 'en'
      GROUP BY vb.visit_id
  ),

  procedure_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT COALESCE(c.name, o.order_name), ', ') AS procedure_list,
          COUNT(DISTINCT o.order_id)                                AS procedure_count
      FROM visit_base vb
      LEFT JOIN encounters e
          ON e.visit_uuid = vb.visit_uuid
          AND COALESCE(e.encounter_voided, false) = false
      LEFT JOIN orders o
          ON o.encounter_uuid = e.encounter_uuid
          AND COALESCE(o.voided, false) = false
          AND o.order_type_name ILIKE '%procedure%'
          AND o.order_action NOT ILIKE '%DISCONTINUE%'
      LEFT JOIN concepts c
          ON c.uuid = o.concept_uuid
          AND COALESCE(c.retired, false) = false
          AND c.locale = 'en'
      GROUP BY vb.visit_id
  ),

  drug_data AS (
      SELECT
          vb.visit_id,
          STRING_AGG(DISTINCT COALESCE(o.drug_name, o.order_name), '; ') AS drugs_list,
          COUNT(DISTINCT o.order_id)                                     AS drug_count,
          STRING_AGG(DISTINCT pr.provider_name, '; ')                    AS prescribers
      FROM visit_base vb
      LEFT JOIN encounters e
          ON e.visit_uuid = vb.visit_uuid
          AND COALESCE(e.encounter_voided, false) = false
      LEFT JOIN orders o
          ON o.encounter_uuid = e.encounter_uuid
          AND COALESCE(o.voided, false) = false
          AND (
              o.order_type_name ILIKE '%drug%'
              OR o.drug_name IS NOT NULL
          )
          AND o.order_action NOT ILIKE '%DISCONTINUE%'
      LEFT JOIN providers pr
          ON pr.provider_id = o.orderer
      GROUP BY vb.visit_id
  ),

  -- ---------------------------------------------------------------------------
  -- Per-visit product sets (computed ONCE) - replaces V4's correlated sub-queries
  -- ---------------------------------------------------------------------------
  visit_test_products AS (
      SELECT DISTINCT e.visit_uuid, o.concept_uuid AS product_uuid
      FROM orders o
      JOIN encounters e ON e.encounter_uuid = o.encounter_uuid
      WHERE COALESCE(o.voided, false) = false
        AND o.order_type_name ILIKE '%test%'
        AND o.order_action NOT ILIKE '%DISCONTINUE%'
        AND o.concept_uuid IS NOT NULL
  ),

  visit_procedure_products AS (
      SELECT DISTINCT e.visit_uuid, o.concept_uuid AS product_uuid
      FROM orders o
      JOIN encounters e ON e.encounter_uuid = o.encounter_uuid
      WHERE COALESCE(o.voided, false) = false
        AND o.order_type_name ILIKE '%procedure%'
        AND o.order_action NOT ILIKE '%DISCONTINUE%'
        AND o.concept_uuid IS NOT NULL
  ),

  visit_drug_products AS (
      SELECT DISTINCT e.visit_uuid, COALESCE(o.drug_uuid, o.concept_uuid) AS product_uuid
      FROM orders o
      JOIN encounters e ON e.encounter_uuid = o.encounter_uuid
      WHERE COALESCE(o.voided, false) = false
        AND (o.order_type_name ILIKE '%drug%' OR o.drug_name IS NOT NULL)
        AND o.order_action NOT ILIKE '%DISCONTINUE%'
        AND COALESCE(o.drug_uuid, o.concept_uuid) IS NOT NULL
  ),

  lab_test_cost_data AS (
      SELECT
          vb.visit_id,
          COALESCE(SUM(sol.subtotal), 0) AS lab_test_cost
      FROM visit_base vb
      JOIN visit_test_products vtp
          ON vtp.visit_uuid = vb.visit_uuid
      JOIN sale_order_lines sol
          ON sol.customer_uuid       = vb.patient_uuid
          AND sol.product_external_id = vtp.product_uuid
          AND sol.order_state NOT ILIKE '%cancel%'
      GROUP BY vb.visit_id
  ),

  procedure_cost_data AS (
      SELECT
          vb.visit_id,
          COALESCE(SUM(sol.subtotal), 0) AS procedure_cost
      FROM visit_base vb
      JOIN visit_procedure_products vpp
          ON vpp.visit_uuid = vb.visit_uuid
      JOIN sale_order_lines sol
          ON sol.customer_uuid       = vb.patient_uuid
          AND sol.product_external_id = vpp.product_uuid
          AND sol.order_state NOT ILIKE '%cancel%'
      GROUP BY vb.visit_id
  ),

  drug_cost_data AS (
      SELECT
          vb.visit_id,
          COALESCE(SUM(sol.subtotal), 0) AS drug_cost
      FROM visit_base vb
      JOIN visit_drug_products vdp
          ON vdp.visit_uuid = vb.visit_uuid
      JOIN sale_order_lines sol
          ON sol.customer_uuid       = vb.patient_uuid
          AND sol.product_external_id = vdp.product_uuid
          AND sol.order_state NOT ILIKE '%cancel%'
      GROUP BY vb.visit_id
  ),

  invoice_data AS (
      SELECT
          vb.visit_id,
          COALESCE(SUM(sol.subtotal), 0) AS invoice_sum
      FROM visit_base vb
      LEFT JOIN sale_order_lines sol
          ON sol.customer_uuid = vb.patient_uuid
          AND sol.order_state NOT ILIKE '%cancel%'
      GROUP BY vb.visit_id
  ),

  -- Odoo pricelist on the patient's latest sale order line (coverage tier, not insurer).
  pricelist_data AS (
      SELECT DISTINCT ON (vb.visit_id)
          vb.visit_id,
          sol.pricelist
      FROM visit_base vb
      LEFT JOIN sale_order_lines sol
          ON sol.customer_uuid = vb.patient_uuid
          AND sol.order_state NOT ILIKE '%cancel%'
      ORDER BY vb.visit_id, sol.line_creation_date DESC NULLS LAST
  )

  SELECT
      vb.visit_id                                 AS "ID de visite",
      vb.visit_date                               AS "Date de visite",
      vb.visit_location                           AS "Lieu d'accueil",
      COALESCE(ce.consultation_location, '-')     AS "Lieu de consultation",
      COALESCE(ed.care_locations, '')             AS "Lieux de soins",
      COALESCE(tdd.treating_doctor, '-')          AS "Médecin traitant",
      REGEXP_REPLACE(
          COALESCE(idd.uvl_id, vb.identifiers, '-'),
          '([A-Za-z])([0-9])',
          '\1-\2'
      )                                           AS "ID du patient",
      COALESCE(vb.given_name, '-')                AS "Prénom",
      COALESCE(vb.family_name, '-')               AS "Nom",
      COALESCE(idd.cni, '-')                      AS "CNI Burundi",
      COALESCE(idd.legacy_id, '-')                AS "Ancien ID (Legacy ID)",
      COALESCE(idd.openmrs_id, '-')               AS "ID OpenMRS",
      COALESCE(bcd.birth_certificate, '-')        AS "Acte de naissance",
      vb.dob                                      AS "Date de naissance",
      vb.age                                      AS "Âge",
      vb.gender                                   AS "Sexe",
      COALESCE(pad.chef_de_menage, '-')           AS "Chef de ménage",
      COALESCE(vb.province, '-')                  AS "Province",
      COALESCE(vb.commune, '-')                   AS "Commune",
      COALESCE(vb.zone, '-')                      AS "Zone",
      COALESCE(vb.colline, '-')                   AS "Colline",
      COALESCE(vad.case_type, '-')                AS "Type de cas",
      COALESCE(vad.consultation_type, '-')        AS "Type de consultation",
      COALESCE(vad.disease_category, '-')         AS "Catégorie de maladie",
      COALESCE(ps.pregnancy, '-')                 AS "Grossesse",
      COALESCE(ccd.chief_complaints, '-')         AS "Motifs de consultation",
      COALESCE(ed.encounter_list, '')             AS "Liste des rencontres",
      COALESCE(ed.encounter_count, 0)             AS "Nombre de rencontres",
      COALESCE(dd.diagnosis_list, '')             AS "Liste des diagnostics",
      COALESCE(dd.diagnosis_count, 0)             AS "Nombre de diagnostics",
      COALESCE(dd.confirmed_diagnosis_list, '')   AS "Liste des diagnostics confirmés",
      COALESCE(dd.confirmed_diagnosis_count, 0)   AS "Nombre de diagnostics confirmés",
      COALESCE(ltd.lab_tests_list, '')            AS "Liste des examens de laboratoire",
      COALESCE(ltd.lab_test_count, 0)             AS "Nombre d'examens de laboratoire",
      COALESCE(lcd.lab_test_cost, 0)              AS "Coût des examens de laboratoire",
      COALESCE(pd.procedure_list, '')             AS "Liste des procédures",
      COALESCE(pd.procedure_count, 0)             AS "Nombre de procédures",
      COALESCE(pcd.procedure_cost, 0)             AS "Coût des procédures",
      COALESCE(drd.drugs_list, '')                AS "Liste des médicaments",
      COALESCE(drd.drug_count, 0)                 AS "Nombre de médicaments",
      COALESCE(drd.prescribers, '-')              AS "Prescripteur(s)",
      COALESCE(dcd.drug_cost, 0)                  AS "Coût des médicaments",
      COALESCE(id.invoice_sum, 0)                 AS "Montant de la facture",
      COALESCE(vad.payer, pld.pricelist, '-')     AS "Assurance",
      CASE
          WHEN vad.payer ILIKE '%supplement%' OR vad.payer ILIKE '%complément%' THEN vad.payer
          ELSE '-'
      END                                         AS "Assurance complémentaire",
      COALESCE(pad.coverage_tier, '-')            AS "Taux de couverture",
      COALESCE(pld.pricelist, '-')                AS "Liste de prix Odoo"
  FROM visit_base vb
  LEFT JOIN identifier_data        idd ON idd.visit_id = vb.visit_id
  LEFT JOIN person_attribute_data  pad ON pad.visit_id = vb.visit_id
  LEFT JOIN visit_attribute_data   vad ON vad.visit_id = vb.visit_id
  LEFT JOIN consultation_encounter ce  ON ce.visit_id  = vb.visit_id
  LEFT JOIN treating_doctor_data   tdd ON tdd.visit_id = vb.visit_id
  LEFT JOIN pregnancy_status       ps  ON ps.visit_id  = vb.visit_id
  LEFT JOIN chief_complaint_data   ccd ON ccd.visit_id = vb.visit_id
  LEFT JOIN birth_certificate_data bcd ON bcd.visit_id = vb.visit_id
  LEFT JOIN encounter_data         ed  ON ed.visit_id  = vb.visit_id
  LEFT JOIN diagnosis_data         dd  ON dd.visit_id  = vb.visit_id
  LEFT JOIN lab_test_data          ltd ON ltd.visit_id = vb.visit_id
  LEFT JOIN procedure_data         pd  ON pd.visit_id  = vb.visit_id
  LEFT JOIN drug_data              drd ON drd.visit_id = vb.visit_id
  LEFT JOIN lab_test_cost_data     lcd ON lcd.visit_id = vb.visit_id
  LEFT JOIN procedure_cost_data    pcd ON pcd.visit_id = vb.visit_id
  LEFT JOIN drug_cost_data         dcd ON dcd.visit_id = vb.visit_id
  LEFT JOIN invoice_data           id  ON id.visit_id  = vb.visit_id
  LEFT JOIN pricelist_data         pld ON pld.visit_id = vb.visit_id
  ORDER BY vb.visit_date DESC, vb.visit_id
