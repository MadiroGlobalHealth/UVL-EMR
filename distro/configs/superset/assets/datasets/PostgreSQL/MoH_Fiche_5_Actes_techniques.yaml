table_name: MoH Fiche 5 Actes techniques
main_dttm_col: MOIS
description: "UVL-EMR \xB7 Minist\xE8re \xAB Fiche 5 \xBB (#909), tableau 1: actes\
  \ techniques (commandes de type Proc\xE9dure hors consultations et imagerie) par\
  \ code, tranche d'\xE2ge et sexe. \xAB D\xE9c\xE8s durant l'acte \xBB n'est pas\
  \ enregistr\xE9 (colonne vide)."
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: "-- Fiche 5 (MoH, #909), table 1: notification des actes techniques\n-- One row\
  \ per MOIS x SERVICE x CODE x INTITULE; 18 age bands x H/F; Total. DECES DURANT\
  \ L'ACTE is not recorded anywhere (left empty).\n-- An act = a non-voided Procedure\
  \ order other than DISCONTINUE rows, excluding consultations, imaging and the birth\
  \ certificate.\nWITH pt AS (\n    SELECT p.patient_uuid, p.gender, p.birthdate\n\
  \    FROM patients p\n    WHERE COALESCE(p.person_voided, false) = false\n     \
  \ AND NOT (COALESCE(p.family_name, '') ~* '^(SYNTH-|E2E|QA|TEST|DEMO)'\n       \
  \     OR COALESCE(p.given_name,  '') ~* '^(SYNTH-|E2E|QA|TEST|DEMO)')\n),\nx AS\
  \ (\n    SELECT DATE_TRUNC('month', o.date_activated)::date AS mois,\n         \
  \  CASE e.location_uuid WHEN '44c3efb0-2583-4c80-a79e-1f756a03c0a1' THEN 'Consultation\
  \ externe' WHEN '9D062929-CC4F-7A51-C700-2B968AADEC34' THEN 'Urgences' WHEN 'e1f4ab17-6dc5-4249-cf38-5bae7dbe9c64'\
  \ THEN 'Ophtalmologie' WHEN 'f2a5bc28-7ed6-435a-da49-6cbf8ecfad75' THEN 'Dentisterie'\
  \ ELSE COALESCE(e.location, 'Non renseign\xE9') END AS service,\n           COALESCE(SUBSTRING(o.order_name\
  \ FROM '^([A-Z]{2,4}[0-9]{2,3}) '), 'Sans code') AS code,\n           COALESCE(NULLIF(TRIM(REGEXP_REPLACE(o.order_name,\
  \ '^[A-Z]{2,4}[0-9]{2,3} - ', '')), ''), o.order_name) AS intitule,\n          \
  \ pt.gender AS sexe,\n           CASE WHEN a.dd IS NULL THEN NULL WHEN a.dd <= 28\
  \ THEN 1 WHEN a.m < 12 THEN 2 WHEN a.m < 60 THEN 3 WHEN a.y <= 9 THEN 4 WHEN a.y\
  \ <= 14 THEN 5 WHEN a.y <= 17 THEN 6 WHEN a.y <= 19 THEN 7 WHEN a.y <= 64 THEN 8\
  \ + (a.y::int - 20) / 5 WHEN a.y <= 70 THEN 17 ELSE 18 END AS b\n    FROM orders\
  \ o\n    JOIN encounters e ON e.encounter_uuid = o.encounter_uuid\n    JOIN pt ON\
  \ pt.patient_uuid = e.patient_uuid\n    LEFT JOIN visits v ON v.visit_uuid = e.visit_uuid\n\
  \    CROSS JOIN LATERAL (SELECT o.date_activated::date - COALESCE(pt.birthdate,\
  \ v.patient_birthdate) AS dd, DATE_PART('year', AGE(o.date_activated::date, COALESCE(pt.birthdate,\
  \ v.patient_birthdate))) AS y, DATE_PART('year', AGE(o.date_activated::date, COALESCE(pt.birthdate,\
  \ v.patient_birthdate))) * 12 + DATE_PART('month', AGE(o.date_activated::date, COALESCE(pt.birthdate,\
  \ v.patient_birthdate))) AS m) a\n    WHERE o.order_type_uuid = '67a92e56-0f88-11ea-8d71-362b9e155667'\n\
  \      AND COALESCE(o.voided, false) = false\n      AND COALESCE(o.order_action,\
  \ 'NEW') <> 'DISCONTINUE'\n      AND COALESCE(e.encounter_voided, false) = false\n\
  \      AND COALESCE(v.visit_voided, false) = false\n      AND e.location_uuid IS\
  \ DISTINCT FROM '450be362-59a7-4ccd-964d-ebd930a8b30f'\n      AND o.order_name !~*\
  \ 'consultation'\n      AND o.order_name !~ '^(RX|EC)[0-9]'\n      AND o.order_name\
  \ !~* '(x-ray|ultrasound|birth certificate)'\n)\nSELECT\n    x.mois AS \"MOIS\"\
  ,\n    x.service AS \"SERVICE\",\n    x.code AS \"CODE\",\n    x.intitule AS \"\
  INTITULE\",\n    COUNT(*) FILTER (WHERE x.b = 1 AND x.sexe = 'M') AS \"0-28 jours\
  \ H\",\n    COUNT(*) FILTER (WHERE x.b = 1 AND x.sexe = 'F') AS \"0-28 jours F\"\
  ,\n    COUNT(*) FILTER (WHERE x.b = 2 AND x.sexe = 'M') AS \"29 jours-11 mois H\"\
  ,\n    COUNT(*) FILTER (WHERE x.b = 2 AND x.sexe = 'F') AS \"29 jours-11 mois F\"\
  ,\n    COUNT(*) FILTER (WHERE x.b = 3 AND x.sexe = 'M') AS \"12-59 mois H\",\n \
  \   COUNT(*) FILTER (WHERE x.b = 3 AND x.sexe = 'F') AS \"12-59 mois F\",\n    COUNT(*)\
  \ FILTER (WHERE x.b = 4 AND x.sexe = 'M') AS \"5-9 ans H\",\n    COUNT(*) FILTER\
  \ (WHERE x.b = 4 AND x.sexe = 'F') AS \"5-9 ans F\",\n    COUNT(*) FILTER (WHERE\
  \ x.b = 5 AND x.sexe = 'M') AS \"10-14 ans H\",\n    COUNT(*) FILTER (WHERE x.b\
  \ = 5 AND x.sexe = 'F') AS \"10-14 ans F\",\n    COUNT(*) FILTER (WHERE x.b = 6\
  \ AND x.sexe = 'M') AS \"15-17 ans H\",\n    COUNT(*) FILTER (WHERE x.b = 6 AND\
  \ x.sexe = 'F') AS \"15-17 ans F\",\n    COUNT(*) FILTER (WHERE x.b = 7 AND x.sexe\
  \ = 'M') AS \"18-19 ans H\",\n    COUNT(*) FILTER (WHERE x.b = 7 AND x.sexe = 'F')\
  \ AS \"18-19 ans F\",\n    COUNT(*) FILTER (WHERE x.b = 8 AND x.sexe = 'M') AS \"\
  20-24 ans H\",\n    COUNT(*) FILTER (WHERE x.b = 8 AND x.sexe = 'F') AS \"20-24\
  \ ans F\",\n    COUNT(*) FILTER (WHERE x.b = 9 AND x.sexe = 'M') AS \"25-29 ans\
  \ H\",\n    COUNT(*) FILTER (WHERE x.b = 9 AND x.sexe = 'F') AS \"25-29 ans F\"\
  ,\n    COUNT(*) FILTER (WHERE x.b = 10 AND x.sexe = 'M') AS \"30-34 ans H\",\n \
  \   COUNT(*) FILTER (WHERE x.b = 10 AND x.sexe = 'F') AS \"30-34 ans F\",\n    COUNT(*)\
  \ FILTER (WHERE x.b = 11 AND x.sexe = 'M') AS \"35-39 ans H\",\n    COUNT(*) FILTER\
  \ (WHERE x.b = 11 AND x.sexe = 'F') AS \"35-39 ans F\",\n    COUNT(*) FILTER (WHERE\
  \ x.b = 12 AND x.sexe = 'M') AS \"40-44 ans H\",\n    COUNT(*) FILTER (WHERE x.b\
  \ = 12 AND x.sexe = 'F') AS \"40-44 ans F\",\n    COUNT(*) FILTER (WHERE x.b = 13\
  \ AND x.sexe = 'M') AS \"45-49 ans H\",\n    COUNT(*) FILTER (WHERE x.b = 13 AND\
  \ x.sexe = 'F') AS \"45-49 ans F\",\n    COUNT(*) FILTER (WHERE x.b = 14 AND x.sexe\
  \ = 'M') AS \"50-54 ans H\",\n    COUNT(*) FILTER (WHERE x.b = 14 AND x.sexe = 'F')\
  \ AS \"50-54 ans F\",\n    COUNT(*) FILTER (WHERE x.b = 15 AND x.sexe = 'M') AS\
  \ \"55-59 ans H\",\n    COUNT(*) FILTER (WHERE x.b = 15 AND x.sexe = 'F') AS \"\
  55-59 ans F\",\n    COUNT(*) FILTER (WHERE x.b = 16 AND x.sexe = 'M') AS \"60-64\
  \ ans H\",\n    COUNT(*) FILTER (WHERE x.b = 16 AND x.sexe = 'F') AS \"60-64 ans\
  \ F\",\n    COUNT(*) FILTER (WHERE x.b = 17 AND x.sexe = 'M') AS \"65-70 ans H\"\
  ,\n    COUNT(*) FILTER (WHERE x.b = 17 AND x.sexe = 'F') AS \"65-70 ans F\",\n \
  \   COUNT(*) FILTER (WHERE x.b = 18 AND x.sexe = 'M') AS \"71 ans et + H\",\n  \
  \  COUNT(*) FILTER (WHERE x.b = 18 AND x.sexe = 'F') AS \"71 ans et + F\",\n   \
  \ COUNT(*) FILTER (WHERE x.sexe = 'M') AS \"TOTAL H\",\n    COUNT(*) FILTER (WHERE\
  \ x.sexe = 'F') AS \"TOTAL F\",\n    NULL::int AS \"DECES DURANT L'ACTE\",\n   \
  \ COUNT(*) AS \"TOTAL\",\n    COUNT(*) FILTER (WHERE x.b IS NULL OR x.sexe IS NULL\
  \ OR x.sexe NOT IN ('M', 'F')) AS \"AGE OU SEXE NON RENSEIGNE\"\nFROM x\nGROUP BY\
  \ x.mois, x.service, x.code, x.intitule\nORDER BY x.mois DESC, x.service, \"TOTAL\"\
  \ DESC, x.code\n"
