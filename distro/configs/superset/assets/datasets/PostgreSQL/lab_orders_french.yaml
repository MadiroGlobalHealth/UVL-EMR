table_name: lab_orders_french
main_dttm_col: Date de consultation
description: null
default_endpoint: null
offset: 0
cache_timeout: null
schema: public
sql: "SELECT\n    o.encounter_datetime  AS \"Date de consultation\",\n    replace(replace(p.identifiers,\
  \ 'UVL ID: ', ''), 'UVL', 'UVL-') AS \"ID du patient\",\n    p.gender          \
  \    AS \"Sexe\",\n    date_part('year', age(o.encounter_datetime, p.birthdate))::int\
  \ AS \"\xC2ge (ann\xE9es)\",\n    o.order_name          AS \"Nom du test\",\n  \
  \  p.address_city        AS \"Ville\",\n    o.care_setting_name   AS \"Cadre de\
  \ soins\",\n    p.birthdate           AS \"Date de naissance\",\n    CASE\n    \
  \    WHEN date_part('year', age(o.encounter_datetime, p.birthdate)) < 1  THEN '<1'\n\
  \        WHEN date_part('year', age(o.encounter_datetime, p.birthdate)) < 5  THEN\
  \ '1-4'\n        WHEN date_part('year', age(o.encounter_datetime, p.birthdate))\
  \ < 15 THEN '5-14'\n        WHEN date_part('year', age(o.encounter_datetime, p.birthdate))\
  \ < 25 THEN '15-24'\n        WHEN date_part('year', age(o.encounter_datetime, p.birthdate))\
  \ < 50 THEN '25-49'\n        WHEN date_part('year', age(o.encounter_datetime, p.birthdate))\
  \ < 65 THEN '50-64'\n        ELSE '65+'\n    END                   AS \"Tranche\
  \ d'\xE2ge\",\n    o.orderer             AS \"ID du prescripteur\",\n    o.order_id\
  \            AS \"ID de commande\",\n    e.location            AS \"Service demandeur\"\
  ,\n    p.given_name          AS \"Prenom\",\n    p.family_name         AS \"Nom\
  \ de famille\",\n    CASE WHEN EXISTS (SELECT 1 FROM observations pr WHERE pr.patient_uuid\
  \ = o.patient_uuid AND pr.question_label = 'Pregnant Women') THEN 'Oui' ELSE 'Non'\
  \ END AS \"Femme enceinte\",\n    (SELECT COALESCE(obs.answer_coded, obs.answer_text,\
  \ obs.answer_numeric::text)\n       FROM observations obs\n      WHERE obs.encounter_uuid\
  \ = o.encounter_uuid\n        AND obs.question_uuid = o.concept_uuid\n        AND\
  \ COALESCE(obs.answer_coded, obs.answer_text, obs.answer_numeric::text) IS NOT NULL\n\
  \      ORDER BY obs.obs_date_time DESC\n      LIMIT 1)            AS \"Resultat\
  \ du test\"\nFROM orders o\nLEFT JOIN patients p ON p.patient_uuid = o.patient_uuid\n\
  LEFT JOIN encounters e ON e.encounter_uuid = o.encounter_uuid\nWHERE o.order_type_name\
  \ = 'Test Order'\n  AND COALESCE(o.voided, false) = false"
