  MARKDOWN-pbf-notes:
    children: []
    id: MARKDOWN-pbf-notes
    meta:
      code: "### Rapports PBF et DHIS2 — version provisoire\n\n**À confirmer avec Didier avant toute soumission.**\
        \ Les modèles source (PBF_Template_Translated.xlsx\net Hospital_Activity_Report_Translated.pdf,\
        \ envoyés le 6 août 2026) n'étaient pas disponibles lors de la\nconstruction : la liste des indicateurs,\
        \ les tranches d'âge et les règles sont provisoires (UVL-EMR#240, #241, #242).\n\n- **PBF – Indicateurs\
        \ par mois** : une ligne par indicateur. *Statut* : `computed` (l'EMR enregistre ce qu'il faut),\n\
        \  `partial` (approximation, voir la liste des écarts), `not captured` (pas encore saisi : la\
        \ cellule reste vide, ce n'est pas un zéro).\n- **Liste des écarts** : ce que le modèle demande\
        \ et ce que l'EMR ne fournit pas encore (#240).\n- **Lignes de vérification** : chaque unité comptée\
        \ (visite, examen, journée), avec l'ID UVL, pour la vérification\n  mensuelle (contrat, art. 4\
        \ et 6). Le total d'un mois est la somme de la colonne *quantity*.\n- **MSP** : consultations\
        \ externes = visites avec une rencontre *Outpatient Consultation*; date et service = la\n  dernière\
        \ consultation de la visite. Âge à la date de consultation. Morbidité : diagnostics confirmés\
        \ seulement.\n- Les dates sont en UTC (heure OpenMRS). Utilisez le filtre **Date / Période** pour\
        \ choisir le mois."
      height: 50
      width: 12
