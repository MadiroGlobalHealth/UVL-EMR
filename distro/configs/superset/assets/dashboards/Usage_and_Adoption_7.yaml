  MARKDOWN-usage-notes:
    children: []
    id: MARKDOWN-usage-notes
    meta:
      code: '### Usage and adoption


        Reported monthly by the implementation lead (UVL-EMR#285). The **Date / Period** filter
        sets the range for every chart except the target tables and the fixed baseline.


        - **Active users**: distinct OpenMRS users who saved an encounter, an order or a visit
        in the period. Logins are not recorded in the analytics database, so a user who only
        looked at records is not counted.

        - **Patients registered**: new patient records (by creation date). **Patients seen**:
        distinct patients with an encounter or a visit.

        - **Encounters** by encounter type; **orders** by order type, new orders only (revisions
        and discontinuations excluded). Voided records are excluded everywhere.

        - **Against target**: targets and their denominators (staff trained, eligible encounters
        and orders) are set in the `targets` list of the *usage_summary* dataset. Target columns
        stay empty until they are set.

        - Weeks start on Monday. Times are UTC as stored by OpenMRS (02:00 in Bujumbura).'
      height: 40
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-usage-notes
    type: MARKDOWN
