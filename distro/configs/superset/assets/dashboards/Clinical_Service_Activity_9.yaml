    children: []
    id: MARKDOWN-svc-notes
    meta:
      code: "### Activité des services cliniques\n\nUn tableau de bord par service, au fur et à mesure\
        \ de leur mise en service (UVL-EMR#243) : hospitalisation,\nmaternité, néonatologie, bloc opératoire,\
        \ banque de sang, planification familiale, nutrition, urgences.\n\n- Une rencontre appartient\
        \ à un service selon son **lieu**, son **type de rencontre** ou son **formulaire**\n  (table `services`\
        \ du jeu de données *service_activity*). La première correspondance l'emporte : une rencontre\n\
        \  en salle de césarienne compte en Maternité, pas en Hospitalisation.\n- Un service *pending*\
        \ n'a pas encore de formulaires en production : il n'apparaît pas tant qu'aucune rencontre ne\n\
        \  correspond. À chaque mise en service, vérifier les motifs et passer le statut à *live*.\n-\
        \ Rencontres et patients excluent les enregistrements annulés. Heures en UTC (heure OpenMRS)."
      height: 50
      width: 12
