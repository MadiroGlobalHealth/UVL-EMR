slice_name: "Fiche 19 \u2013 M\xE9dicaments, r\xE9actifs et dispositifs, h\xF4pital\
  \ (MoH)"
description: "Fiche 19 (7.1), niveau h\xF4pital: une ligne par produit. Consomm\xE9\
  e/distribu\xE9e = dispensation aux patients + sorties vers un service, un d\xE9\
  partement ou l'ext\xE9rieur; les transferts de la pharmacie centrale vers les boxes\
  \ de dispensation ne sont pas compt\xE9s. CMM/DMM = moyenne mensuelle sur les 6\
  \ derniers mois. Sorties vers communaut\xE9: non enregistr\xE9."
